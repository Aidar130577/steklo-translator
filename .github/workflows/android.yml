name: Android debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pure Java tests
        run: |
          mkdir -p /tmp/steklo-tests
          javac -encoding UTF-8 -d /tmp/steklo-tests app/src/main/java/kz/steklo/translator/TradeText.java app/src/main/java/kz/steklo/translator/TranslationSession.java tests/TradeTextTest.java tests/TranslationSessionTest.java app/src/main/java/kz/steklo/translator/DictionaryLookup.java tests/DictionaryLookupTest.java
          java -cp /tmp/steklo-tests TradeTextTest
          java -cp /tmp/steklo-tests TranslationSessionTest
          java -cp /tmp/steklo-tests DictionaryLookupTest
      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Steklo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
